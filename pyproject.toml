[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noveltrad"
version = "0.1.0"
description = "Local-first reader and translation workspace for EPUB and PDF novels"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "pymupdf>=1.24,<2.0",
  "ebooklib>=0.18,<1.0",
  "beautifulsoup4>=4.12,<5.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]

[project.scripts]
noveltrad = "noveltrad.main:run"
noveltrad-backup = "noveltrad.backup_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
